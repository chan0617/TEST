<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>이미지 재단기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; }

    #topbar {
      position: sticky; top: 0; z-index: 100;
      background: #16213e; border-bottom: 1px solid #0f3460;
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    }
    #topbar h1 { font-size: 1rem; font-weight: 700; margin-right: auto; }

    button {
      padding: 8px 18px; border: none; border-radius: 6px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #btn-add   { background: #0f3460; color: #eee; }
    #btn-crop  { background: #e94560; color: #fff; }
    #btn-zip   { background: #16a085; color: #fff; display: none; }
    #btn-clear { background: #333; color: #aaa; display: none; }
    input[type=file] { display: none; }

    #drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: calc(100vh - 52px); gap: 8px; cursor: pointer;
      border: 2px dashed #0f3460; margin: 20px; border-radius: 12px;
    }
    #drop:hover, #drop.over { border-color: #e94560; }
    #drop p { color: #555; font-size: 0.9rem; }

    #grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px; padding: 20px;
    }
    .card { background: #16213e; border-radius: 8px; overflow: hidden; border: 1px solid #0f3460; }
    .card img { width: 100%; height: 150px; object-fit: contain; background: #111827; display: block; }
    .card p { font-size: 0.7rem; color: #666; padding: 5px 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card a { font-size: 0.7rem; color: #16a085; padding: 0 8px 6px; display: block; text-decoration: none; }
    .card a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>이미지 재단기</h1>
  <button id="btn-add">이미지 추가</button>
  <button id="btn-crop" disabled>재단하기</button>
  <button id="btn-zip">전체 다운로드 (ZIP)</button>
  <button id="btn-clear">초기화</button>
  <input type="file" id="file-input" accept="image/*" multiple/>
  <input type="file" id="add-input"  accept="image/*" multiple/>
</div>

<div id="drop">
  <p>이미지를 드래그하거나 클릭하세요</p>
  <p style="font-size:.78rem;color:#333">여러 장 가능 · JPG · PNG · WebP</p>
</div>
<div id="grid"></div>

<script>
const queue = [];
const saved = [];

// 업로드
const drop = document.getElementById('drop');
document.getElementById('file-input').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
document.getElementById('add-input' ).addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
drop.addEventListener('click',     () => document.getElementById('file-input').click());
drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop',      e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
document.getElementById('btn-add').addEventListener('click', () => document.getElementById('add-input').click());

function addFiles(files) {
  Array.from(files).filter(f => f.type.startsWith('image/')).forEach(file => {
    const url = URL.createObjectURL(file);
    const card  = document.createElement('div'); card.className = 'card';
    const thumb = document.createElement('img'); thumb.src = url;
    const label = document.createElement('p');   label.textContent = file.name;
    card.appendChild(thumb);
    card.appendChild(label);
    document.getElementById('grid').appendChild(card);

    const img = new Image();
    img.onload = () => queue.push({ img, file, thumb, label, card });
    img.src = url;
  });

  drop.style.display = 'none';
  document.getElementById('grid').style.display = 'grid';
  document.getElementById('btn-crop').disabled = false;
  document.getElementById('btn-clear').style.display = 'inline-block';
}

// 재단하기
document.getElementById('btn-crop').addEventListener('click', async () => {
  document.getElementById('btn-crop').disabled = true;

  for (const { img, file, thumb, label, card } of queue) {
    const result = await trim(img);
    if (!result) continue;

    const name = file.name.replace(/\.[^.]+$/, '') + '_재단.png';
    const url  = URL.createObjectURL(result);
    saved.push({ blob: result, name });

    thumb.src = url;
    label.textContent = name;

    // 저장 링크 (중복 방지)
    if (!card.querySelector('a')) {
      const a = document.createElement('a');
      a.href = url; a.download = name; a.textContent = '저장';
      card.appendChild(a);
    }
  }

  if (saved.length) document.getElementById('btn-zip').style.display = 'inline-block';
  document.getElementById('btn-crop').disabled = false;
});

// ── 픽셀 분석 여백 제거 ──────────────────────────────────────────
function trim(img) {
  const W = img.naturalWidth;
  const H = img.naturalHeight;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, W, H).data;

  function px(x, y) {
    const i = (y * W + x) * 4;
    return { r: d[i], g: d[i+1], b: d[i+2], a: d[i+3] };
  }

  // 4모서리 픽셀 평균 → 배경색 기준
  const corners = [px(0,0), px(W-1,0), px(0,H-1), px(W-1,H-1)];
  const bgR = corners.reduce((s,p) => s + p.r, 0) / 4;
  const bgG = corners.reduce((s,p) => s + p.g, 0) / 4;
  const bgB = corners.reduce((s,p) => s + p.b, 0) / 4;
  const THR = 15;

  function isBg(x, y) {
    const { r, g, b, a } = px(x, y);
    if (a < 10) return true; // 투명 픽셀도 배경
    return Math.abs(r - bgR) <= THR &&
           Math.abs(g - bgG) <= THR &&
           Math.abs(b - bgB) <= THR;
  }

  let top = -1, bottom = -1, left = -1, right = -1;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (!isBg(x, y)) { top = y; break; }
    }
    if (top !== -1) break;
  }

  for (let y = H - 1; y >= 0; y--) {
    for (let x = 0; x < W; x++) {
      if (!isBg(x, y)) { bottom = y; break; }
    }
    if (bottom !== -1) break;
  }

  if (top === -1 || bottom === -1) return null;

  for (let x = 0; x < W; x++) {
    for (let y = top; y <= bottom; y++) {
      if (!isBg(x, y)) { left = x; break; }
    }
    if (left !== -1) break;
  }

  for (let x = W - 1; x >= 0; x--) {
    for (let y = top; y <= bottom; y++) {
      if (!isBg(x, y)) { right = x; break; }
    }
    if (right !== -1) break;
  }

  if (left === -1 || right === -1 || right <= left || bottom <= top) return null;

  const cw = right - left + 1;
  const ch = bottom - top + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(img, left, top, cw, ch, 0, 0, cw, ch);
  return new Promise(res => out.toBlob(res, 'image/png'));
}

// ZIP
document.getElementById('btn-zip').addEventListener('click', async () => {
  const btn = document.getElementById('btn-zip');
  btn.disabled = true;
  const zip = new JSZip();
  saved.forEach(({ blob, name }) => zip.file(name, blob));
  const z = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(z); a.download = '재단이미지.zip'; a.click();
  btn.disabled = false;
});

// 초기화
document.getElementById('btn-clear').addEventListener('click', () => {
  queue.length = 0; saved.length = 0;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('grid').style.display = 'none';
  drop.style.display = 'flex';
  document.getElementById('btn-crop').disabled = true;
  document.getElementById('btn-zip').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
});
</script>
</body>
</html>
