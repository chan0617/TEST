<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>스마트 크롭</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a1a2e;color:#eee;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px;gap:24px}
    h1{font-size:1.8rem;background:linear-gradient(90deg,#e94560,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    #status{font-size:.85rem;color:#888}
    #status.ready{color:#16a085}

    #drop{width:100%;max-width:860px;border:2px dashed #e94560;border-radius:14px;padding:40px;text-align:center;cursor:pointer;background:#16213e;transition:background .2s}
    #drop:hover,#drop.over{background:#0f3460}
    #drop p{color:#bbb;margin-top:10px;font-size:.9rem}
    #drop input{display:none}

    #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;width:100%;max-width:860px}

    .card{background:#16213e;border-radius:10px;overflow:hidden;border:2px solid #0f3460}
    .card img{width:100%;height:120px;object-fit:cover;display:block}
    .card-info{padding:6px 8px;font-size:.7rem;color:#888;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .card-info a{color:#16a085;text-decoration:none;display:block;margin-top:2px}
    .card-info a:hover{text-decoration:underline}

    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:700;color:#fff;margin-bottom:4px}
    .b-processing{background:#e67e22}
    .b-done{background:#16a085}
    .b-fail{background:#c0392b}

    button{padding:10px 24px;border:none;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s}
    button:hover{opacity:.85}
    button:disabled{opacity:.3;cursor:not-allowed}
    #btn-zip{background:#16a085;color:#fff;display:none}

    #loader{position:fixed;inset:0;background:rgba(26,26,46,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99}
    #loader p{color:#bbb;font-size:.9rem}
    .spin{width:38px;height:38px;border:4px solid #333;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div id="loader">
  <div class="spin"></div>
  <p>AI 모델 로딩 중...</p>
</div>

<h1>✂️ 스마트 크롭</h1>
<p id="status">AI 모델 준비 중...</p>

<div id="drop">
  <div style="font-size:2.4rem">🖼️</div>
  <p><strong>클릭</strong>하거나 이미지를 드래그하세요 (여러 장 가능)</p>
  <input type="file" id="file-input" accept="image/*" multiple/>
</div>

<div id="grid"></div>

<button id="btn-zip">⬇️ 전체 ZIP 다운로드</button>

<script>
let model = null;
const blobs = [];

// 모델 로드
cocoSsd.load().then(m => {
  model = m;
  document.getElementById('loader').style.display = 'none';
  const s = document.getElementById('status');
  s.textContent = 'AI 준비 완료 — 이미지를 올려주세요';
  s.className = 'ready';
}).catch(() => {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('status').textContent = '모델 로드 실패 — 중앙 크롭으로 동작합니다';
});

// 업로드
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file-input');

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => handle(Array.from(e.target.files)));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); handle(Array.from(e.dataTransfer.files)); });

function handle(files) {
  files.filter(f => f.type.startsWith('image/')).forEach(process);
}

async function process(file) {
  // 카드 생성
  const card = document.createElement('div');
  card.className = 'card';
  const badge = document.createElement('div');
  badge.className = 'badge b-processing';
  badge.textContent = '인식 중...';
  const info = document.createElement('div');
  info.className = 'card-info';
  info.appendChild(badge);
  info.appendChild(document.createTextNode(file.name));
  card.appendChild(info);
  document.getElementById('grid').appendChild(card);

  try {
    const img = await loadImage(URL.createObjectURL(file));
    const rect = await detect(img);
    const blob = crop(img, rect);

    const outName = 'cropped_' + file.name.replace(/\.[^.]+$/, '') + '.png';
    blobs.push({ name: outName, blob });

    // 결과 썸네일
    const thumb = document.createElement('img');
    thumb.src = URL.createObjectURL(blob);
    card.insertBefore(thumb, info);

    badge.className = 'badge b-done';
    badge.textContent = '완료';

    const dl = document.createElement('a');
    dl.href = thumb.src; dl.download = outName; dl.textContent = '개별 다운로드';
    info.appendChild(dl);

    document.getElementById('btn-zip').style.display = 'inline-block';
  } catch(e) {
    badge.className = 'badge b-fail';
    badge.textContent = '오류';
  }
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

async function detect(img) {
  if (model) {
    const preds = await model.detect(img);
    if (preds.length) {
      const best = preds.reduce((a,b) => a.score > b.score ? a : b);
      const [x, y, w, h] = best.bbox;
      const pad = Math.min(w, h) * 0.1;
      return {
        x: Math.max(0, x - pad),
        y: Math.max(0, y - pad),
        w: Math.min(w + pad*2, img.width),
        h: Math.min(h + pad*2, img.height),
      };
    }
  }
  // 감지 못하면 중앙 80%
  return { x: img.width*.1, y: img.height*.1, w: img.width*.8, h: img.height*.8 };
}

function crop(img, r) {
  const c = document.createElement('canvas');
  c.width = Math.round(r.w); c.height = Math.round(r.h);
  c.getContext('2d').drawImage(img, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
  return dataURLtoBlob(c.toDataURL('image/png'));
}

function dataURLtoBlob(dataURL) {
  const [header, data] = dataURL.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bytes = atob(data);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// ZIP
document.getElementById('btn-zip').addEventListener('click', async () => {
  const btn = document.getElementById('btn-zip');
  btn.disabled = true; btn.textContent = 'ZIP 생성 중...';
  const zip = new JSZip();
  blobs.forEach(({ name, blob }) => zip.file(name, blob));
  const z = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(z); a.download = 'cropped.zip'; a.click();
  btn.disabled = false; btn.textContent = '⬇️ 전체 ZIP 다운로드';
});
</script>
</body>
</html>
