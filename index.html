<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>이미지 재단기</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 고정 바 */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      flex-wrap: wrap;
    }

    #topbar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #eee;
      margin-right: 8px;
    }

    #ai-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e67e22;
      flex-shrink: 0;
    }
    #ai-dot.ready { background: #16a085; }

    #ai-label { font-size: 0.75rem; color: #666; }

    .spacer { flex: 1; }

    button {
      padding: 8px 18px;
      border: none; border-radius: 6px;
      font-size: 0.85rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    #btn-add  { background: #0f3460; color: #eee; }
    #btn-zip  { background: #16a085; color: #fff; display: none; }
    #btn-clear { background: #333; color: #aaa; display: none; }

    #file-input, #add-input { display: none; }

    /* 드롭 존 */
    #drop {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 260px;
      border: 2px dashed #0f3460;
      margin: 24px;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop:hover, #drop.over { border-color: #e94560; background: rgba(233,69,96,0.04); }
    #drop p { color: #555; font-size: 0.9rem; }

    /* 결과 그리드 */
    #grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      padding: 24px;
    }

    .card {
      background: #16213e;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
      background: #1a1a2e;
      display: block;
    }

    .card-body {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-name {
      font-size: 0.72rem;
      color: #888;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    .card-status {
      font-size: 0.7rem;
      color: #e67e22;
    }
    .card-status.done { color: #16a085; }
    .card-status.fail { color: #e94560; }

    .card-dl {
      font-size: 0.72rem;
      color: #16a085;
      text-decoration: none;
      display: none;
    }
    .card-dl:hover { text-decoration: underline; }

    /* 스피너 */
    .spin {
      width: 20px; height: 20px;
      border: 3px solid #333;
      border-top-color: #e67e22;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- 상단 버튼 바 -->
<div id="topbar">
  <h1>이미지 재단기</h1>
  <div id="ai-dot"></div>
  <span id="ai-label">AI 로딩 중</span>
  <div class="spacer"></div>
  <button id="btn-add">이미지 추가</button>
  <button id="btn-zip">전체 다운로드 (ZIP)</button>
  <button id="btn-clear">초기화</button>
  <input type="file" id="file-input" accept="image/*" multiple/>
  <input type="file" id="add-input"  accept="image/*" multiple/>
</div>

<!-- 드롭 존 -->
<div id="drop">
  <p>이미지를 드래그하거나 클릭해서 올려주세요</p>
  <p style="font-size:.8rem;color:#444">JPG · PNG · WebP · 여러 장 가능</p>
</div>

<!-- 결과 그리드 -->
<div id="grid"></div>

<script>
let model = null;
const results = []; // { blob, name }

// AI 백그라운드 로드
cocoSsd.load().then(m => {
  model = m;
  document.getElementById('ai-dot').className = 'ready';
  document.getElementById('ai-label').textContent = 'AI 준비 완료';
}).catch(() => {
  document.getElementById('ai-label').textContent = 'AI 없음 (여백 자동 제거)';
});

// 업로드 이벤트
const drop      = document.getElementById('drop');
const fileInput = document.getElementById('file-input');
const addInput  = document.getElementById('add-input');

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { process(Array.from(e.target.files)); e.target.value = ''; });
addInput.addEventListener('change',  e => { process(Array.from(e.target.files)); e.target.value = ''; });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); process(Array.from(e.dataTransfer.files)); });

document.getElementById('btn-add').addEventListener('click', () => addInput.click());

document.getElementById('btn-clear').addEventListener('click', () => {
  results.length = 0;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('grid').style.display = 'none';
  drop.style.display = 'flex';
  document.getElementById('btn-zip').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
});

// 이미지 처리
function process(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;

  drop.style.display = 'none';
  const grid = document.getElementById('grid');
  grid.style.display = 'grid';
  document.getElementById('btn-clear').style.display = 'inline-block';

  imgs.forEach(file => {
    // 카드 생성
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.className = 'card-img';
    img.src = URL.createObjectURL(file);

    const body = document.createElement('div');
    body.className = 'card-body';

    const name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = file.name;

    const status = document.createElement('div');
    status.className = 'card-status';

    const spinWrap = document.createElement('div');
    spinWrap.style.display = 'flex'; spinWrap.style.alignItems = 'center'; spinWrap.style.gap = '6px';
    const spin = document.createElement('div'); spin.className = 'spin';
    spinWrap.appendChild(spin); spinWrap.appendChild(status);
    status.textContent = '분석 중...';

    const dl = document.createElement('a');
    dl.className = 'card-dl';
    dl.textContent = '개별 다운로드';

    body.appendChild(name);
    body.appendChild(spinWrap);
    body.appendChild(dl);
    card.appendChild(img);
    card.appendChild(body);
    grid.appendChild(card);

    // 자동 재단
    const srcImg = new Image();
    srcImg.onload = async () => {
      try {
        const rect = await getAutoCropRect(srcImg);
        const blob = await cropBlob(srcImg, rect);

        const outName = file.name.replace(/\.[^.]+$/, '') + '_재단.png';
        results.push({ blob, name: outName });

        const url = URL.createObjectURL(blob);
        img.src = url;
        spin.remove();
        status.textContent = `${Math.round(rect.w)} x ${Math.round(rect.h)}px`;
        status.className = 'card-status done';
        dl.href = url; dl.download = outName; dl.style.display = 'block';

        document.getElementById('btn-zip').style.display = 'inline-block';
      } catch(e) {
        spin.remove();
        status.textContent = '처리 실패';
        status.className = 'card-status fail';
      }
    };
    srcImg.src = URL.createObjectURL(file);
  });
}

// AI 감지 → 없으면 여백 제거
async function getAutoCropRect(img) {
  if (model) {
    try {
      const preds = await model.detect(img);
      if (preds.length) {
        const best = preds.reduce((a, b) => a.score > b.score ? a : b);
        const [bx, by, bw, bh] = best.bbox;
        const pad = Math.min(bw, bh) * 0.08;
        return clamp({
          x: bx - pad,
          y: by - pad,
          w: bw + pad * 2,
          h: bh + pad * 2,
        }, img.width, img.height);
      }
    } catch(e) {}
  }
  return trimWhitespace(img);
}

// 여백(배경색) 자동 제거
function trimWhitespace(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, img.width, img.height).data;

  const bgR = d[0], bgG = d[1], bgB = d[2];
  const thr = 30;

  function isBg(x, y) {
    const i = (y * img.width + x) * 4;
    return Math.abs(d[i]-bgR) < thr && Math.abs(d[i+1]-bgG) < thr && Math.abs(d[i+2]-bgB) < thr;
  }

  let top = 0, bottom = img.height - 1, left = 0, right = img.width - 1;

  top:    for (let y = 0;            y < img.height; y++) { for (let x = 0; x < img.width;  x++) { if (!isBg(x,y)) { top    = y; break top;    } } }
  bottom: for (let y = img.height-1; y >= 0;         y--) { for (let x = 0; x < img.width;  x++) { if (!isBg(x,y)) { bottom = y; break bottom; } } }
  left:   for (let x = 0;            x < img.width;  x++) { for (let y = top; y <= bottom;  y++) { if (!isBg(x,y)) { left   = x; break left;   } } }
  right:  for (let x = img.width-1;  x >= 0;         x--) { for (let y = top; y <= bottom;  y++) { if (!isBg(x,y)) { right  = x; break right;  } } }

  const pad = 8;
  return clamp({ x: left-pad, y: top-pad, w: right-left+pad*2, h: bottom-top+pad*2 }, img.width, img.height);
}

function clamp(r, iw, ih) {
  const x = Math.max(0, r.x);
  const y = Math.max(0, r.y);
  return { x, y, w: Math.min(r.w, iw-x), h: Math.min(r.h, ih-y) };
}

function cropBlob(img, rect) {
  return new Promise((resolve, reject) => {
    const c = document.createElement('canvas');
    c.width  = Math.round(rect.w);
    c.height = Math.round(rect.h);
    c.getContext('2d').drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    c.toBlob(b => b ? resolve(b) : reject(), 'image/png');
  });
}

// ZIP
document.getElementById('btn-zip').addEventListener('click', async () => {
  if (!results.length) return;
  const btn = document.getElementById('btn-zip');
  btn.disabled = true; btn.textContent = '생성 중...';
  const zip = new JSZip();
  results.forEach(({ blob, name }) => zip.file(name, blob));
  const z = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(z); a.download = '재단이미지.zip'; a.click();
  btn.disabled = false; btn.textContent = '전체 다운로드 (ZIP)';
});
</script>
</body>
</html>
