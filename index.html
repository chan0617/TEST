<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이미지 크롭 도구</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: #aaa;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    #drop-zone {
      width: 100%;
      max-width: 700px;
      border: 2px dashed #e94560;
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      background: #16213e;
    }

    #drop-zone:hover, #drop-zone.drag-over {
      background: #0f3460;
    }

    #drop-zone p { color: #ccc; margin-top: 12px; }

    #drop-zone input { display: none; }

    .icon { font-size: 3rem; }

    #workspace {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      margin-top: 32px;
      gap: 20px;
    }

    #canvas-container {
      position: relative;
      display: inline-block;
      cursor: crosshair;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    #canvas-container canvas { display: block; }

    #selection {
      position: absolute;
      border: 2px solid #e94560;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    #btn-crop { background: #e94560; color: #fff; }
    #btn-reset { background: #0f3460; color: #fff; }
    #btn-download { background: #16a085; color: #fff; display: none; }
    #btn-new { background: #555; color: #fff; }

    #result-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #result-section h2 { font-size: 1.2rem; color: #e94560; }

    #result-canvas {
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      max-width: 100%;
    }

    .info {
      font-size: 0.85rem;
      color: #888;
    }

    .ratio-presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ratio-btn {
      padding: 6px 14px;
      background: #0f3460;
      color: #ccc;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .ratio-btn.active {
      background: #e94560;
      color: #fff;
    }
  </style>
</head>
<body>

<h1>✂️ 이미지 크롭 도구</h1>
<p class="subtitle">이미지를 업로드하고 원하는 영역을 선택해 잘라내세요.</p>

<div id="drop-zone">
  <div class="icon">🖼️</div>
  <p><strong>클릭</strong>하거나 이미지를 여기에 <strong>드래그</strong>하세요</p>
  <p style="font-size:0.8rem; margin-top:6px;">JPG, PNG, WebP, GIF 지원</p>
  <input type="file" id="file-input" accept="image/*" />
</div>

<div id="workspace">
  <p class="info" id="img-info"></p>

  <div class="ratio-presets">
    <button class="ratio-btn active" data-ratio="free">자유 선택</button>
    <button class="ratio-btn" data-ratio="1:1">1 : 1</button>
    <button class="ratio-btn" data-ratio="4:3">4 : 3</button>
    <button class="ratio-btn" data-ratio="16:9">16 : 9</button>
    <button class="ratio-btn" data-ratio="3:4">3 : 4</button>
    <button class="ratio-btn" data-ratio="9:16">9 : 16</button>
  </div>

  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
    <div id="selection" style="display:none;"></div>
  </div>

  <div class="controls">
    <button id="btn-crop">✂️ 크롭</button>
    <button id="btn-reset">↺ 선택 초기화</button>
    <button id="btn-new">📂 새 이미지</button>
  </div>

  <div id="result-section">
    <h2>크롭 결과</h2>
    <canvas id="result-canvas"></canvas>
    <p class="info" id="result-info"></p>
    <button id="btn-download">⬇️ 다운로드</button>
  </div>
</div>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const workspace = document.getElementById('workspace');
  const mainCanvas = document.getElementById('main-canvas');
  const ctx = mainCanvas.getContext('2d');
  const selDiv = document.getElementById('selection');
  const resultSection = document.getElementById('result-section');
  const resultCanvas = document.getElementById('result-canvas');
  const rCtx = resultCanvas.getContext('2d');
  const imgInfo = document.getElementById('img-info');
  const resultInfo = document.getElementById('result-info');
  const btnDownload = document.getElementById('btn-download');

  let img = null;
  let scale = 1;
  let sel = { x: 0, y: 0, w: 0, h: 0 };
  let dragging = false;
  let startX, startY;
  let currentRatio = 'free';

  // File open
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    loadFile(e.dataTransfer.files[0]);
  });

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const image = new Image();
      image.onload = () => {
        img = image;
        setupCanvas();
        workspace.style.display = 'flex';
        dropZone.style.display = 'none';
        resultSection.style.display = 'none';
        btnDownload.style.display = 'none';
        clearSelection();
      };
      image.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setupCanvas() {
    const maxW = Math.min(window.innerWidth - 40, 860);
    const maxH = window.innerHeight * 0.6;
    scale = Math.min(maxW / img.width, maxH / img.height, 1);
    mainCanvas.width = Math.round(img.width * scale);
    mainCanvas.height = Math.round(img.height * scale);
    ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
    imgInfo.textContent = `원본 크기: ${img.width} × ${img.height}px`;
  }

  function clearSelection() {
    sel = { x: 0, y: 0, w: 0, h: 0 };
    selDiv.style.display = 'none';
  }

  // Ratio presets
  document.querySelectorAll('.ratio-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRatio = btn.dataset.ratio;
      clearSelection();
    });
  });

  // Mouse draw selection
  mainCanvas.addEventListener('mousedown', e => {
    const r = mainCanvas.getBoundingClientRect();
    startX = e.clientX - r.left;
    startY = e.clientY - r.top;
    dragging = true;
    clearSelection();
    resultSection.style.display = 'none';
    btnDownload.style.display = 'none';
  });

  mainCanvas.addEventListener('mousemove', e => {
    if (!dragging) return;
    const r = mainCanvas.getBoundingClientRect();
    let x = e.clientX - r.left;
    let y = e.clientY - r.top;
    updateSelection(x, y);
  });

  mainCanvas.addEventListener('mouseup', () => { dragging = false; });

  // Touch support
  mainCanvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const r = mainCanvas.getBoundingClientRect();
    const t = e.touches[0];
    startX = t.clientX - r.left;
    startY = t.clientY - r.top;
    dragging = true;
    clearSelection();
  }, { passive: false });

  mainCanvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!dragging) return;
    const r = mainCanvas.getBoundingClientRect();
    const t = e.touches[0];
    updateSelection(t.clientX - r.left, t.clientY - r.top);
  }, { passive: false });

  mainCanvas.addEventListener('touchend', () => { dragging = false; });

  function updateSelection(x, y) {
    let dx = x - startX;
    let dy = y - startY;

    if (currentRatio !== 'free') {
      const [rw, rh] = currentRatio.split(':').map(Number);
      const ratio = rw / rh;
      if (Math.abs(dx) / ratio > Math.abs(dy)) {
        dy = (dx / ratio) * Math.sign(dy || 1);
      } else {
        dx = dy * ratio * Math.sign(dx || 1);
      }
    }

    sel.x = dx >= 0 ? startX : startX + dx;
    sel.y = dy >= 0 ? startY : startY + dy;
    sel.w = Math.abs(dx);
    sel.h = Math.abs(dy);

    // Clamp to canvas
    sel.x = Math.max(0, Math.min(sel.x, mainCanvas.width));
    sel.y = Math.max(0, Math.min(sel.y, mainCanvas.height));
    if (sel.x + sel.w > mainCanvas.width) sel.w = mainCanvas.width - sel.x;
    if (sel.y + sel.h > mainCanvas.height) sel.h = mainCanvas.height - sel.y;

    const rect = mainCanvas.getBoundingClientRect();
    selDiv.style.display = sel.w > 2 && sel.h > 2 ? 'block' : 'none';
    selDiv.style.left = sel.x + 'px';
    selDiv.style.top = sel.y + 'px';
    selDiv.style.width = sel.w + 'px';
    selDiv.style.height = sel.h + 'px';
  }

  document.getElementById('btn-crop').addEventListener('click', () => {
    if (sel.w < 4 || sel.h < 4) { alert('영역을 먼저 선택해주세요.'); return; }

    const sx = sel.x / scale;
    const sy = sel.y / scale;
    const sw = sel.w / scale;
    const sh = sel.h / scale;

    resultCanvas.width = Math.round(sw);
    resultCanvas.height = Math.round(sh);
    rCtx.drawImage(img, sx, sy, sw, sh, 0, 0, resultCanvas.width, resultCanvas.height);

    resultInfo.textContent = `크롭 크기: ${resultCanvas.width} × ${resultCanvas.height}px`;
    resultSection.style.display = 'flex';
    btnDownload.style.display = 'inline-block';
    resultSection.scrollIntoView({ behavior: 'smooth' });
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    clearSelection();
    resultSection.style.display = 'none';
    btnDownload.style.display = 'none';
  });

  document.getElementById('btn-new').addEventListener('click', () => {
    img = null;
    fileInput.value = '';
    workspace.style.display = 'none';
    dropZone.style.display = 'block';
    clearSelection();
  });

  btnDownload.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'cropped_image.png';
    link.href = resultCanvas.toDataURL('image/png');
    link.click();
  });
</script>
</body>
</html>
