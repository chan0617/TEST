<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>이미지 재단기</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

    #topbar {
      position: sticky; top: 0; z-index: 100;
      background: #16213e; border-bottom: 1px solid #0f3460;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; flex-wrap: wrap;
    }
    #topbar h1 { font-size: 1rem; font-weight: 700; }
    #ai-label { font-size: 0.72rem; color: #e67e22; margin-right: auto; }
    #ai-label.ready { color: #16a085; }

    button { padding: 7px 16px; border: none; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    #btn-add   { background: #0f3460; color: #eee; }
    #btn-zip   { background: #16a085; color: #fff; }
    #btn-clear { background: #333; color: #aaa; }
    input[type=file] { display: none; }

    #empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: calc(100vh - 52px); gap: 10px; cursor: pointer;
      border: 2px dashed #0f3460; margin: 20px; border-radius: 12px;
    }
    #empty:hover, #empty.over { border-color: #e94560; }
    #empty p { color: #555; font-size: 0.9rem; }

    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; padding: 20px; }

    .card { background: #16213e; border-radius: 8px; overflow: hidden; border: 1px solid #0f3460; }
    .card-thumb { width: 100%; height: 160px; object-fit: contain; background: #111827; display: block; }
    .card-info { padding: 6px 10px; font-size: 0.72rem; display: flex; justify-content: space-between; align-items: center; }
    .card-info .st { color: #e67e22; }
    .card-info .st.done { color: #16a085; }
    .card-info .st.fail { color: #e94560; }
    .card-info a { color: #16a085; text-decoration: none; font-size: 0.7rem; }
    .card-info a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>이미지 재단기</h1>
  <span id="ai-label">AI 로딩 중...</span>
  <button id="btn-add">이미지 추가</button>
  <button id="btn-zip" disabled>전체 다운로드 (ZIP)</button>
  <button id="btn-clear">초기화</button>
  <input type="file" id="file-input" accept="image/*" multiple/>
  <input type="file" id="add-input"  accept="image/*" multiple/>
</div>

<div id="empty">
  <p>이미지를 드래그하거나 클릭하세요</p>
  <p style="font-size:.78rem;color:#333">여러 장 가능 · JPG · PNG · WebP</p>
</div>
<div id="grid" style="display:none"></div>

<script>
let model = null;
let modelReady = false;
const pending = [];   // 모델 대기 중인 item
const blobs = [];

// 모델 로드 — 완료되면 pending 처리
cocoSsd.load().then(m => {
  model = m;
  finishModelLoad();
}).catch(() => {
  finishModelLoad();
});

function finishModelLoad() {
  modelReady = true;
  const lbl = document.getElementById('ai-label');
  lbl.textContent = model ? 'AI 준비 완료' : 'AI 없음 (여백 제거 모드)';
  if (model) lbl.className = 'ready';
  pending.splice(0).forEach(item => processItem(item));
}

// 업로드 이벤트
const empty = document.getElementById('empty');
document.getElementById('file-input').addEventListener('change', e => { pick(e); e.target.value=''; });
document.getElementById('add-input' ).addEventListener('change', e => { pick(e); e.target.value=''; });
empty.addEventListener('click',     () => document.getElementById('file-input').click());
empty.addEventListener('dragover',  e => { e.preventDefault(); empty.classList.add('over'); });
empty.addEventListener('dragleave', () => empty.classList.remove('over'));
empty.addEventListener('drop',      e => { e.preventDefault(); empty.classList.remove('over'); addFiles(Array.from(e.dataTransfer.files)); });
document.getElementById('btn-add').addEventListener('click', () => document.getElementById('add-input').click());

function pick(e) { addFiles(Array.from(e.target.files)); }

function addFiles(files) {
  files.filter(f => f.type.startsWith('image/')).forEach(addOne);
}

function addOne(file) {
  empty.style.display = 'none';
  document.getElementById('grid').style.display = 'grid';

  // 카드 생성 + 원본 바로 표시
  const card  = document.createElement('div');
  card.className = 'card';

  const thumb = document.createElement('img');
  thumb.className = 'card-thumb';
  thumb.src = URL.createObjectURL(file);  // 원본 즉시 표시

  const info = document.createElement('div');
  info.className = 'card-info';

  const st = document.createElement('span');
  st.className = 'st';
  st.textContent = modelReady ? '재단 중...' : 'AI 대기 중...';

  info.appendChild(st);
  card.appendChild(thumb);
  card.appendChild(info);
  document.getElementById('grid').appendChild(card);

  const item = { file, thumb, st, info };
  if (modelReady) {
    processItem(item);
  } else {
    pending.push(item);
  }
}

async function processItem({ file, thumb, st, info }) {
  st.textContent = '재단 중...';
  try {
    const img  = await loadImg(URL.createObjectURL(file));
    const rect = await autoCrop(img);

    if (!rect || rect.w < 1 || rect.h < 1) throw new Error('no rect');

    const blob    = await cropBlob(img, rect);
    const outName = file.name.replace(/\.[^.]+$/, '') + '_재단.png';
    const url     = URL.createObjectURL(blob);

    blobs.push({ blob, name: outName });

    thumb.src = url;   // 재단된 이미지로 교체

    st.className = 'st done';
    st.textContent = `${Math.round(rect.w)} × ${Math.round(rect.h)}`;

    const a = document.createElement('a');
    a.href = url; a.download = outName; a.textContent = '저장';
    info.appendChild(a);

    document.getElementById('btn-zip').disabled = false;
  } catch(e) {
    st.className = 'st fail';
    st.textContent = '실패: ' + (e.message || e);
    console.error(e);
  }
}

// ── 자동 재단 ───────────────────────────────────────────────────
async function autoCrop(img) {
  // 1) AI 객체 감지
  if (model) {
    try {
      const preds = await model.detect(img);
      if (preds.length) {
        const best = preds.reduce((a, b) => a.score > b.score ? a : b);
        const [bx, by, bw, bh] = best.bbox;
        const pad = Math.min(bw, bh) * 0.08;
        const r = { x: bx - pad, y: by - pad, w: bw + pad * 2, h: bh + pad * 2 };
        return clamp(r, img.width, img.height);
      }
    } catch(e) { console.warn('detect fail', e); }
  }
  // 2) 여백(배경) 제거
  return trimBg(img);
}

function trimBg(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, img.width, img.height).data;

  // 4개 모서리 색상 평균 → 배경색 추정
  function px(x, y) {
    const i = (y * img.width + x) * 4;
    return [d[i], d[i+1], d[i+2]];
  }
  const corners = [px(0,0), px(img.width-1,0), px(0,img.height-1), px(img.width-1,img.height-1)];
  const bg = corners.reduce((a,b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]]).map(v => v/4);
  const thr = 25;

  function isBg(x, y) {
    const i = (y * img.width + x) * 4;
    return (
      Math.abs(d[i]   - bg[0]) < thr &&
      Math.abs(d[i+1] - bg[1]) < thr &&
      Math.abs(d[i+2] - bg[2]) < thr
    );
  }

  let t = 0, b = img.height - 1, l = 0, r = img.width - 1;
  let found;

  found = false;
  for (let y = 0; y < img.height && !found; y++)
    for (let x = 0; x < img.width; x++)
      if (!isBg(x, y)) { t = y; found = true; break; }

  found = false;
  for (let y = img.height - 1; y >= 0 && !found; y--)
    for (let x = 0; x < img.width; x++)
      if (!isBg(x, y)) { b = y; found = true; break; }

  found = false;
  for (let x = 0; x < img.width && !found; x++)
    for (let y = t; y <= b; y++)
      if (!isBg(x, y)) { l = x; found = true; break; }

  found = false;
  for (let x = img.width - 1; x >= 0 && !found; x--)
    for (let y = t; y <= b; y++)
      if (!isBg(x, y)) { r = x; found = true; break; }

  const pad = 6;
  return clamp({ x: l - pad, y: t - pad, w: (r - l) + pad * 2, h: (b - t) + pad * 2 }, img.width, img.height);
}

function clamp(r, maxW, maxH) {
  const x = Math.max(0, r.x);
  const y = Math.max(0, r.y);
  const w = Math.min(r.w, maxW - x);
  const h = Math.min(r.h, maxH - y);
  return { x, y, w, h };
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload  = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

function cropBlob(img, rect) {
  return new Promise((res, rej) => {
    const c = document.createElement('canvas');
    c.width  = Math.round(rect.w);
    c.height = Math.round(rect.h);
    if (c.width < 1 || c.height < 1) { rej(new Error('zero size')); return; }
    c.getContext('2d').drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    c.toBlob(b => b ? res(b) : rej(new Error('toBlob null')), 'image/png');
  });
}

// ZIP
document.getElementById('btn-zip').addEventListener('click', async () => {
  if (!blobs.length) return;
  const btn = document.getElementById('btn-zip');
  btn.disabled = true; btn.textContent = '생성 중...';
  const zip = new JSZip();
  blobs.forEach(({ blob, name }) => zip.file(name, blob));
  const z = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(z); a.download = '재단이미지.zip'; a.click();
  btn.disabled = false; btn.textContent = '전체 다운로드 (ZIP)';
});

document.getElementById('btn-clear').addEventListener('click', () => {
  blobs.length = 0;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('grid').style.display = 'none';
  empty.style.display = 'flex';
  document.getElementById('btn-zip').disabled = true;
});
</script>
</body>
</html>
