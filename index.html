<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>이미지 재단기</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    #topbar {
      position: sticky; top: 0; z-index: 100;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; flex-wrap: wrap;
    }

    #topbar h1 { font-size: 1rem; font-weight: 700; color: #eee; }

    #ai-label { font-size: 0.72rem; color: #555; }
    #ai-label.ready { color: #16a085; }

    .spacer { flex: 1; }

    button {
      padding: 7px 16px; border: none; border-radius: 6px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    #btn-add   { background: #0f3460; color: #eee; }
    #btn-zip   { background: #16a085; color: #fff; }
    #btn-clear { background: #333; color: #aaa; }

    input[type=file] { display: none; }

    #empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: calc(100vh - 52px);
      gap: 10px; cursor: pointer;
      border: 2px dashed #0f3460; margin: 20px; border-radius: 12px;
    }
    #empty:hover, #empty.over { border-color: #e94560; }
    #empty p { color: #555; font-size: 0.9rem; }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px; padding: 20px;
    }

    .card {
      background: #16213e;
      border-radius: 8px; overflow: hidden;
      border: 1px solid #0f3460;
    }

    .card-thumb {
      width: 100%; height: 160px;
      object-fit: contain;
      background: #111827;
      display: block;
    }

    .card-info {
      padding: 7px 10px;
      font-size: 0.72rem; color: #666;
      display: flex; justify-content: space-between; align-items: center;
    }

    .card-info a { color: #16a085; text-decoration: none; font-size: 0.7rem; }
    .card-info a:hover { text-decoration: underline; }

    .card-info .processing { color: #e67e22; }
    .card-info .done { color: #16a085; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>이미지 재단기</h1>
  <span id="ai-label">AI 로딩 중...</span>
  <div class="spacer"></div>
  <button id="btn-add">이미지 추가</button>
  <button id="btn-zip" disabled>전체 다운로드 (ZIP)</button>
  <button id="btn-clear">초기화</button>
  <input type="file" id="file-input" accept="image/*" multiple/>
  <input type="file" id="add-input"  accept="image/*" multiple/>
</div>

<div id="empty">
  <p>이미지를 드래그하거나 클릭하세요</p>
  <p style="font-size:.78rem;color:#333">JPG · PNG · WebP · 여러 장 가능</p>
</div>

<div id="grid" style="display:none"></div>

<script>
let model = null;
const blobs = [];

cocoSsd.load().then(m => {
  model = m;
  const el = document.getElementById('ai-label');
  el.textContent = 'AI 준비 완료';
  el.className = 'ready';
}).catch(() => {
  document.getElementById('ai-label').textContent = 'AI 없음';
});

// 이벤트 연결
const empty     = document.getElementById('empty');
const fileInput = document.getElementById('file-input');
const addInput  = document.getElementById('add-input');

empty.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { run(Array.from(e.target.files)); e.target.value = ''; });
addInput.addEventListener('change',  e => { run(Array.from(e.target.files)); e.target.value = ''; });
empty.addEventListener('dragover',  e => { e.preventDefault(); empty.classList.add('over'); });
empty.addEventListener('dragleave', () => empty.classList.remove('over'));
empty.addEventListener('drop', e => { e.preventDefault(); empty.classList.remove('over'); run(Array.from(e.dataTransfer.files)); });

document.getElementById('btn-add').addEventListener('click', () => addInput.click());

document.getElementById('btn-clear').addEventListener('click', () => {
  blobs.length = 0;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('grid').style.display = 'none';
  empty.style.display = 'flex';
  document.getElementById('btn-zip').disabled = true;
});

document.getElementById('btn-zip').addEventListener('click', async () => {
  const btn = document.getElementById('btn-zip');
  btn.disabled = true; btn.textContent = '생성 중...';
  const zip = new JSZip();
  blobs.forEach(({ blob, name }) => zip.file(name, blob));
  const z = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(z);
  a.download = '재단이미지.zip';
  a.click();
  btn.disabled = false; btn.textContent = '전체 다운로드 (ZIP)';
});

function run(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;

  empty.style.display = 'none';
  document.getElementById('grid').style.display = 'grid';

  imgs.forEach(file => {
    // 카드 즉시 생성 + 원본 이미지 바로 표시
    const origUrl = URL.createObjectURL(file);

    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('img');
    thumb.className = 'card-thumb';
    thumb.src = origUrl; // 원본 바로 표시

    const info = document.createElement('div');
    info.className = 'card-info';

    const status = document.createElement('span');
    status.className = 'processing';
    status.textContent = '재단 중...';

    info.appendChild(status);
    card.appendChild(thumb);
    card.appendChild(info);
    document.getElementById('grid').appendChild(card);

    // 백그라운드에서 재단 처리
    const src = new Image();
    src.onload = async () => {
      try {
        const rect = await autoCrop(src);
        const blob = await cropToBlob(src, rect);
        const outName = file.name.replace(/\.[^.]+$/, '') + '_재단.png';

        blobs.push({ blob, name: outName });

        // 재단된 이미지로 교체
        thumb.src = URL.createObjectURL(blob);

        const dl = document.createElement('a');
        dl.href = thumb.src; dl.download = outName; dl.textContent = '저장';

        status.className = 'done';
        status.textContent = `${Math.round(rect.w)} x ${Math.round(rect.h)}`;
        info.appendChild(dl);

        document.getElementById('btn-zip').disabled = false;
      } catch {
        status.className = '';
        status.textContent = '실패';
      }
    };
    src.src = origUrl;
  });
}

async function autoCrop(img) {
  // AI 객체 감지
  if (model) {
    try {
      const preds = await model.detect(img);
      if (preds.length) {
        const best = preds.reduce((a, b) => a.score > b.score ? a : b);
        const [bx, by, bw, bh] = best.bbox;
        const pad = Math.min(bw, bh) * 0.08;
        return clamp({ x: bx-pad, y: by-pad, w: bw+pad*2, h: bh+pad*2 }, img);
      }
    } catch(e) {}
  }
  // 여백 자동 제거
  return trimBg(img);
}

function trimBg(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, img.width, img.height).data;

  const br = d[0], bg = d[1], bb = d[2];
  const thr = 30;

  function isBg(x, y) {
    const i = (y * img.width + x) * 4;
    return Math.abs(d[i]-br)<thr && Math.abs(d[i+1]-bg)<thr && Math.abs(d[i+2]-bb)<thr;
  }

  let t=0, b=img.height-1, l=0, r=img.width-1;
  top:    for (let y=0;           y<img.height; y++) for (let x=0; x<img.width;  x++) { if (!isBg(x,y)) { t=y; break top;    } }
  btm:    for (let y=img.height-1;y>=0;         y--) for (let x=0; x<img.width;  x++) { if (!isBg(x,y)) { b=y; break btm;    } }
  lft:    for (let x=0;           x<img.width;  x++) for (let y=t; y<=b;         y++) { if (!isBg(x,y)) { l=x; break lft;    } }
  rgt:    for (let x=img.width-1; x>=0;         x--) for (let y=t; y<=b;         y++) { if (!isBg(x,y)) { r=x; break rgt;    } }

  const pad = 8;
  return clamp({ x: l-pad, y: t-pad, w: r-l+pad*2, h: b-t+pad*2 }, img);
}

function clamp(r, img) {
  const x = Math.max(0, r.x), y = Math.max(0, r.y);
  return { x, y, w: Math.min(r.w, img.width-x), h: Math.min(r.h, img.height-y) };
}

function cropToBlob(img, rect) {
  return new Promise((res, rej) => {
    const c = document.createElement('canvas');
    c.width  = Math.round(rect.w);
    c.height = Math.round(rect.h);
    c.getContext('2d').drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    c.toBlob(b => b ? res(b) : rej(), 'image/png');
  });
}
</script>
</body>
</html>
