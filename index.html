<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>이미지 재단기</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; }

    #topbar {
      position: sticky; top: 0; z-index: 100;
      background: #16213e; border-bottom: 1px solid #0f3460;
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    }
    #topbar h1 { font-size: 1rem; font-weight: 700; margin-right: auto; }

    button {
      padding: 8px 18px; border: none; border-radius: 6px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    #btn-add    { background: #0f3460; color: #eee; }
    #btn-crop   { background: #e94560; color: #fff; }
    #btn-zip    { background: #16a085; color: #fff; display: none; }
    #btn-clear  { background: #333; color: #aaa; display: none; }
    input[type=file] { display: none; }

    #drop {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: calc(100vh - 52px); gap: 8px; cursor: pointer;
      border: 2px dashed #0f3460; margin: 20px; border-radius: 12px;
    }
    #drop:hover, #drop.over { border-color: #e94560; }
    #drop p { color: #555; font-size: 0.9rem; }

    #grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px; padding: 20px;
    }
    .card { background: #16213e; border-radius: 8px; overflow: hidden; border: 1px solid #0f3460; }
    .card img { width: 100%; height: 150px; object-fit: contain; background: #111827; display: block; }
    .card p { font-size: 0.7rem; color: #666; padding: 5px 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>이미지 재단기</h1>
  <button id="btn-add">이미지 추가</button>
  <button id="btn-crop" disabled>재단하기</button>
  <button id="btn-zip">전체 다운로드 (ZIP)</button>
  <button id="btn-clear">초기화</button>
  <input type="file" id="file-input" accept="image/*" multiple/>
  <input type="file" id="add-input"  accept="image/*" multiple/>
</div>

<div id="drop">
  <p>이미지를 드래그하거나 클릭하세요</p>
  <p style="font-size:.78rem;color:#333">여러 장 가능</p>
</div>
<div id="grid"></div>

<script>
let model = null;
const queue = [];  // { file, img, card }
const saved = [];  // { blob, name }

cocoSsd.load().then(m => { model = m; }).catch(() => {});

// 업로드
const drop = document.getElementById('drop');
document.getElementById('file-input').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
document.getElementById('add-input' ).addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
drop.addEventListener('click',     () => document.getElementById('file-input').click());
drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop',      e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
document.getElementById('btn-add').addEventListener('click', () => document.getElementById('add-input').click());

function addFiles(files) {
  Array.from(files).filter(f => f.type.startsWith('image/')).forEach(file => {
    const url = URL.createObjectURL(file);

    // 카드 생성
    const card = document.createElement('div');
    card.className = 'card';
    const thumb = document.createElement('img');
    thumb.src = url;
    const label = document.createElement('p');
    label.textContent = file.name;
    card.appendChild(thumb);
    card.appendChild(label);
    document.getElementById('grid').appendChild(card);

    // 이미지 로드
    const img = new Image();
    img.onload = () => queue.push({ file, img, thumb, label });
    img.src = url;
  });

  drop.style.display = 'none';
  document.getElementById('grid').style.display = 'grid';
  document.getElementById('btn-crop').disabled = false;
  document.getElementById('btn-clear').style.display = 'inline-block';
}

// 재단하기
document.getElementById('btn-crop').addEventListener('click', async () => {
  const btn = document.getElementById('btn-crop');
  btn.disabled = true;

  for (const item of queue) {
    const blob = await cropOne(item.img);
    if (!blob) continue;

    const name = item.file.name.replace(/\.[^.]+$/, '') + '_재단.png';
    const url  = URL.createObjectURL(blob);
    saved.push({ blob, name });

    item.thumb.src = url;
    item.label.textContent = name;

    const a = document.createElement('a');
    a.href = url; a.download = name;
    a.textContent = '저장';
    a.style.cssText = 'font-size:.7rem;color:#16a085;padding:0 8px 6px;display:block;';
    item.label.after(a);
  }

  document.getElementById('btn-zip').style.display = saved.length ? 'inline-block' : 'none';
  btn.disabled = false;
});

async function cropOne(img) {
  // AI 객체 감지
  if (model) {
    try {
      const preds = await model.detect(img);
      if (preds.length) {
        const best = preds.reduce((a, b) => a.score > b.score ? a : b);
        const [x, y, w, h] = best.bbox;
        return draw(img, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }
    } catch(e) {}
  }
  // 여백 제거 fallback
  return trimCrop(img);
}

function draw(img, x, y, w, h) {
  // 범위 보정
  x = Math.max(0, x);
  y = Math.max(0, y);
  w = Math.min(w, img.naturalWidth  - x);
  h = Math.min(h, img.naturalHeight - y);
  if (w < 1 || h < 1) return null;

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

function trimCrop(img) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(0, 0, W, H).data;

  // 배경색 = 4모서리 평균
  function rgba(x, y) { const i=(y*W+x)*4; return [d[i],d[i+1],d[i+2],d[i+3]]; }
  const samples = [rgba(0,0), rgba(W-1,0), rgba(0,H-1), rgba(W-1,H-1)];
  const bg = [0,1,2].map(ch => samples.reduce((s,p)=>s+p[ch],0)/4);

  function isBg(x, y) {
    const i = (y*W+x)*4;
    return Math.abs(d[i]-bg[0]) < 20 && Math.abs(d[i+1]-bg[1]) < 20 && Math.abs(d[i+2]-bg[2]) < 20;
  }

  let t=0, b=H-1, l=0, r=W-1, found;

  found=false; for(let y=0;y<H&&!found;y++)   for(let x=0;x<W;x++) if(!isBg(x,y)){t=y;found=true;break;}
  found=false; for(let y=H-1;y>=0&&!found;y--) for(let x=0;x<W;x++) if(!isBg(x,y)){b=y;found=true;break;}
  found=false; for(let x=0;x<W&&!found;x++)   for(let y=t;y<=b;y++) if(!isBg(x,y)){l=x;found=true;break;}
  found=false; for(let x=W-1;x>=0&&!found;x--) for(let y=t;y<=b;y++) if(!isBg(x,y)){r=x;found=true;break;}

  return draw(img, l, t, r-l+1, b-t+1);
}

// ZIP
document.getElementById('btn-zip').addEventListener('click', async () => {
  const btn = document.getElementById('btn-zip');
  btn.disabled = true;
  const zip = new JSZip();
  saved.forEach(({ blob, name }) => zip.file(name, blob));
  const z = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(z); a.download = '재단이미지.zip'; a.click();
  btn.disabled = false;
});

// 초기화
document.getElementById('btn-clear').addEventListener('click', () => {
  queue.length = 0; saved.length = 0;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('grid').style.display = 'none';
  drop.style.display = 'flex';
  document.getElementById('btn-crop').disabled = true;
  document.getElementById('btn-zip').style.display = 'none';
  document.getElementById('btn-clear').style.display = 'none';
});
</script>
</body>
</html>
